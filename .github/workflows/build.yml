name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build unsigned APK (Debug)
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="v2.1.1-${BRANCH}-${SHA}"
          fi

          APK_DEST="AutoBankPay-Pro-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBankPay-Pro-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.1' }}
          name: AutoBankPay Pro ${{ env.VERSION }}
          body: |
            ## ⚡ AutoBankPay Pro - Tự Động Duyệt Đơn Hàng Ngân Hàng ${{ env.VERSION }}

            ### 📱 Tải về ứng dụng:
            Tải file **APK** đính kèm bên dưới và cài đặt lên điện thoại Android nhận thông báo ngân hàng.

            - **Tên app:** AutoBankPay Pro
            - **APK đã được ký số chính thức** (không bị Google Play Protect chặn)
            - **Hỗ trợ tối ưu:** Android 8.0 đến Android 16 (API 36)
            - **Tính năng mới v2.1.1:** Cập nhật quyền chạy ngầm, chọn ứng dụng, sửa lỗi hiển thị, cải tiến gọi hộp thoại quyền ứng dụng trực tiếp.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
