name: Build APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Generate signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using provided keystore secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD_VAL=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No keystore secret. Auto-generating a release signing key..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/release.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias autobankpay \
              -storepass AutoBankPay2026 \
              -keypass AutoBankPay2026 \
              -dname "CN=AutoBankPay Pro, OU=Mobile, O=MePetVN, L=Hanoi, ST=Hanoi, C=VN"
            echo "STORE_PASSWORD=AutoBankPay2026" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=autobankpay" >> $GITHUB_ENV
            echo "KEY_PASSWORD_VAL=AutoBankPay2026" >> $GITHUB_ENV
          fi

      - name: Build signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.jks" \
            -Pandroid.injected.signing.store.password="${{ env.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ env.KEY_ALIAS_VAL }}" \
            -Pandroid.injected.signing.key.password="${{ env.KEY_PASSWORD_VAL }}"

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

      - name: Prepare APK Artifact
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="v2.1.1-${BRANCH}-${SHA}"
          fi

          APK_DEST="AutoBankPay-Pro-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBankPay-Pro-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.1' }}
          name: AutoBankPay Pro ${{ env.VERSION }}
          body: |
            ## ⚡ AutoBankPay Pro - Tự Động Duyệt Đơn Hàng Ngân Hàng ${{ env.VERSION }}

            ### 📱 Tải về ứng dụng:
            Tải file **APK** đính kèm bên dưới và cài đặt lên điện thoại Android nhận thông báo ngân hàng.

            - **Tên app:** AutoBankPay Pro
            - **APK đã được ký số chính thức** (không bị Google Play Protect chặn)
            - **Hỗ trợ tối ưu:** Android 8.0 đến Android 16 (API 36)
            - **Tính năng mới v2.1.1:** Cập nhật quyền chạy ngầm, chọn ứng dụng, sửa lỗi hiển thị, cải tiến gọi hộp thoại quyền ứng dụng trực tiếp.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
