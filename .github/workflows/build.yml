name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build APK
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret detected. Building signed Release APK..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.jks" \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
            rm -f "${{ github.workspace }}/release.jks"
            echo "APK_SRC=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          else
            echo "No keystore secret detected. Building installable APK..."
            ./gradlew assembleDebug
            echo "APK_SRC=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          fi

      - name: Prepare APK Artifact
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="${BRANCH}-${SHA}"
          fi

          APK_DEST="NotificationForwarder-VN-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationForwarder-VN-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NotificationForwarder-VN ${{ env.VERSION }}
          body: |
            ## NotificationForwarder (Bản Tiếng Việt) ${{ env.VERSION }}

            ### Tải về
            Tải file APK đính kèm bên dưới và cài đặt lên điện thoại Android.

            > **Hỗ trợ tối ưu:** Android 8.0 đến Android 16 (API 36)
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
